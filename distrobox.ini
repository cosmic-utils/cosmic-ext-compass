[compass-dev]
image=registry.fedoraproject.org/fedora-toolbox:43
pull=true
nvidia=true
additional_packages="rust cargo rust-src clippy rustfmt gcc pkg-config just wayland-devel libxkbcommon-devel mesa-vulkan-drivers vulkan-loader-devel"
init_hooks=rustup component add rust-src clippy rustfmt 2>/dev/null || true; sudo dnf copr enable -y ryanabx/cosmic-epoch && sudo dnf install -y cosmic-desktop
