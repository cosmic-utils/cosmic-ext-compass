name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix; empty increments patch
        required: false
        type: string

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          if [ -z "$version" ]; then
            latest=$(git tag --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/{p;q;}')
            latest=${latest:-v0.0.0}
            IFS=. read -r major minor patch <<<"${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: pip install aiohttp==3.14.3 tomlkit==0.15.1
      - run: |
          python3 scripts/set-release-version.py '${{ steps.version.outputs.version }}'
          cargo update --workspace
          just generate
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock cargo-sources.json resources
          if git diff --staged --quiet; then
            echo 'No release changes to commit'
          else
            git commit -m 'release: v${{ steps.version.outputs.version }}'
            git push origin HEAD
          fi
          git tag -a 'v${{ steps.version.outputs.version }}' -m 'Compass v${{ steps.version.outputs.version }}'
          git push origin 'v${{ steps.version.outputs.version }}'
