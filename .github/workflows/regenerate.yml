name: Regenerate derived files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'i18n/**', 'scripts/gen-metadata.py']

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: python3 -m pip install --requirement requirements-build.txt
      - run: |
          just generate-metadata
          just flatpak-cargo-sources
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add resources cargo-sources.json
          git diff --staged --quiet || git commit -m 'chore: regenerate derived files'
          git push
