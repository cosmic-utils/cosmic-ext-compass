name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just validate-metadata

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: just check

  apkbuild:
    name: APKBUILD
    runs-on: ubuntu-latest
    needs: check
    container:
      image: alpine:edge
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            alpine-sdk sudo git atools \
            cargo-auditable \
            just \
            libxkbcommon-dev \
            pkgconf \
            wayland-dev

      - name: Set up abuild
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          sudo -Hu builder abuild-keygen -a -n
          # Newer abuild writes keys to ~/.config/abuild; older versions use ~/.abuild
          for d in /home/builder/.config/abuild /home/builder/.abuild; do
            [ -d "$d" ] && cp "$d"/*.rsa.pub /etc/apk/keys/ || true
          done
          # Fail loudly here rather than midway through abuild -r if no key was found
          ls /etc/apk/keys/*.rsa.pub

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true

      - name: Generate APKBUILD and source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Create source tarball matching GitHub's archive format
          git archive --format=tar.gz --prefix="cosmic-ext-compass-$VERSION/" HEAD > "/tmp/cosmic-ext-compass-$VERSION.tar.gz"
          CHECKSUM=$(sha512sum "/tmp/cosmic-ext-compass-$VERSION.tar.gz" | awk '{print $1}')

          # Place tarball in distfiles cache where abuild expects it
          mkdir -p /var/cache/distfiles
          cp "/tmp/cosmic-ext-compass-$VERSION.tar.gz" "/var/cache/distfiles/cosmic-ext-compass-$VERSION.tar.gz"
          chmod 644 "/var/cache/distfiles/cosmic-ext-compass-$VERSION.tar.gz"

          # Generate APKBUILD from template
          mkdir -p /home/builder/apkbuild
          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@CHECKSUM@@/$CHECKSUM/g" \
              .github/APKBUILD.template > /home/builder/apkbuild/APKBUILD
          chown -R builder:builder /home/builder/apkbuild

      - name: Lint APKBUILD
        run: apkbuild-lint /home/builder/apkbuild/APKBUILD

      - name: Build package
        run: |
          cd /home/builder/apkbuild
          sudo -Hu builder abuild -r

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just flatpak-deps
      - run: just flatpak-cargo-sources
      - run: just flatpak-bundle x86_64

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, cross: false }
          - { target: aarch64-unknown-linux-gnu, cross: true }
          - { target: armv7-unknown-linux-gnueabihf, cross: true }
          - { target: riscv64gc-unknown-linux-gnu, cross: true }
          - { target: x86_64-unknown-linux-musl, cross: true }
          - { target: aarch64-unknown-linux-musl, cross: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --target ${{ matrix.target }}
