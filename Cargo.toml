[package]
name = "compass"
version = "0.1.2"
rust-version = "1.98"
edition = "2024"
license = "GPL-3.0-only"
description = "A responsive compass for Linux desktops and phones"
homepage = "https://cosmic-utils.org"
repository = "https://github.com/cosmic-utils/cosmic-ext-compass"
authors = ["Frederic Laing <dev@fredfunk.tech>"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.2.1", default-features = false, features = ["proxy", "tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["a11y", "about", "dbus-config", "tokio", "winit", "wayland", "x11", "wgpu"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = false
debug = 1

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
opt-level = 1
